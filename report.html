<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Item | BSHS Lost and Found Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="logo">
        BSHS LOST AND FOUND HUB
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="items.html">Items</a>
        <a href="my-reports.html">My Reports</a>
        <a href="claim-requests.html">My Claim Requests</a>
    </nav>

</header>


<main class="page">

    <h1>Report Lost or Found Item</h1>

    <p class="sub">
        Submit information about a lost or found item.
        Login is optional when submitting a report.
    </p>


    <div id="message"></div>


    <form class="form" id="reportForm">


        <!-- REPORT TYPE -->

        <div class="form-group">

            <label for="type">
                Report Type
            </label>

            <select id="type" required>

                <option value="">
                    Select Type
                </option>

                <option value="Lost Item">
                    Lost Item
                </option>

                <option value="Found Item">
                    Found Item
                </option>

            </select>

        </div>


        <!-- ITEM NAME -->

        <div class="form-group">

            <label for="item">
                Item Name
            </label>

            <input
                type="text"
                id="item"
                placeholder="Example: Wallet, ID, Phone"
                required
            >

        </div>


        <!-- CATEGORY -->

        <div class="form-group">

            <label for="category">
                Category
            </label>

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Electronics">
                    Electronics
                </option>

                <option value="School Supplies">
                    School Supplies
                </option>

                <option value="Documents and IDs">
                    Documents and IDs
                </option>

                <option value="Bags">
                    Bags
                </option>

                <option value="Clothing">
                    Clothing
                </option>

                <option value="Others">
                    Others
                </option>

            </select>

        </div>


        <!-- LOCATION -->

        <div class="form-group">

            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Where was it lost or found?"
                required
            >

        </div>


        <!-- DATE -->

        <div class="form-group">

            <label for="date">
                Date
            </label>

            <input
                type="date"
                id="date"
                required
            >

        </div>


        <!-- DESCRIPTION -->

        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                placeholder="Describe the item and its identifying details."
                required
            ></textarea>

        </div>


        <!-- PHOTO -->

        <div class="form-group">

            <label for="photo">
                Photo
                <span style="font-weight:normal;">
                    (Optional)
                </span>
            </label>

            <input
                type="file"
                id="photo"
                accept="image/*"
            >

            <small>
                Maximum photo size: 1.5 MB
            </small>

        </div>


        <!-- SUBMIT -->

        <button
            type="submit"
            id="submitButton"
        >
            Submit Report
        </button>


    </form>

</main>


<script>

document.addEventListener("DOMContentLoaded", function () {


    const form =
        document.getElementById("reportForm");

    const message =
        document.getElementById("message");

    const dateInput =
        document.getElementById("date");

    const photoInput =
        document.getElementById("photo");

    const submitButton =
        document.getElementById("submitButton");


    /*
        SET TODAY'S DATE
    */

    const today =
        new Date().toISOString().split("T")[0];

    dateInput.value = today;


    /*
        GET OR CREATE DEVICE ID

        This allows reports to be viewed
        in My Reports even without login.
    */

    let deviceId =
        localStorage.getItem("bshs_device_id");


    if (!deviceId) {

        deviceId =
            "device-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2, 10);

        localStorage.setItem(
            "bshs_device_id",
            deviceId
        );

    }


    /*
        SUBMIT REPORT
    */

    form.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            /*
                GET VALUES
            */

            const type =
                document.getElementById("type").value;

            const item =
                document.getElementById("item").value.trim();

            const category =
                document.getElementById("category").value;

            const location =
                document.getElementById("location").value.trim();

            const date =
                document.getElementById("date").value;

            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();


            /*
                CHECK REQUIRED FIELDS
            */

            if (
                type === "" ||
                item === "" ||
                category === "" ||
                location === "" ||
                date === "" ||
                description === ""
            ) {

                message.innerHTML = `
                    <div class="notice error">
                        Please complete all required fields.
                    </div>
                `;

                return;

            }


            /*
                DISABLE BUTTON
            */

            submitButton.disabled = true;

            submitButton.textContent =
                "Submitting...";


            /*
                GET EXISTING REPORTS
            */

            let reports = [];

            try {

                reports =
                    JSON.parse(
                        localStorage.getItem(
                            "bshs_reports"
                        )
                    ) || [];

            } catch (error) {

                reports = [];

            }


            /*
                CREATE REPORT
            */

            const report = {

                id:
                    "report-" +
                    Date.now() +
                    "-" +
                    Math.random()
                        .toString(36)
                        .substring(2, 8),

                type: type,

                item: item,

                category: category,

                location: location,

                date: date,

                description: description,

                photo: "",

                status: "Pending",

                ownerType: "device",

                ownerId: deviceId,

                createdAt:
                    new Date().toISOString()

            };


            /*
                PHOTO UPLOAD
            */

            const file =
                photoInput.files[0];


            if (file) {


                /*
                    CHECK PHOTO SIZE
                */

                if (
                    file.size >
                    1500000
                ) {

                    message.innerHTML = `
                        <div class="notice error">
                            Photo is too large.
                            Please choose an image
                            smaller than 1.5 MB.
                        </div>
                    `;

                    submitButton.disabled = false;

                    submitButton.textContent =
                        "Submit Report";

                    return;

                }


                /*
                    READ PHOTO
                */

                const reader =
                    new FileReader();


                reader.onload =
                    function () {

                        report.photo =
                            reader.result;

                        saveReport(report);

                    };


                reader.onerror =
                    function () {

                        message.innerHTML = `
                            <div class="notice error">
                                Unable to read the photo.
                                Please try again.
                            </div>
                        `;

                        submitButton.disabled =
                            false;

                        submitButton.textContent =
                            "Submit Report";

                    };


                reader.readAsDataURL(file);


            } else {

                saveReport(report);

            }


        }
    );


    /*
        SAVE REPORT
    */

    function saveReport(report) {

        try {

            let reports =
                JSON.parse(
                    localStorage.getItem(
                        "bshs_reports"
                    )
                ) || [];


            reports.push(report);


            localStorage.setItem(
                "bshs_reports",
                JSON.stringify(reports)
            );


            /*
                SUCCESS
            */

            message.innerHTML = `
                <div class="notice success">
                    Report submitted successfully!
                    Redirecting to My Reports...
                </div>
            `;


            form.reset();

            dateInput.value = today;


            /*
                GO DIRECTLY TO MY REPORTS
            */

            setTimeout(
                function () {

                    window.location.href =
                        "my-reports.html";

                },
                1000
            );


        } catch (error) {

            console.error(error);


            message.innerHTML = `
                <div class="notice error">
                    The report could not be saved.
                    Please try again.
                </div>
            `;


            submitButton.disabled =
                false;

            submitButton.textContent =
                "Submit Report";

        }

    }

});

</script>


</body>
</html>
