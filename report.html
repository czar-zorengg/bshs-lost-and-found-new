<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Report Item</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="site-header">

  <div class="logo">
    BSHS LOST AND FOUND HUB
  </div>

  <nav id="studentNav"></nav>

</header>



<main class="page">

  <h1>Report Lost or Found Item</h1>

  <p class="sub">
    Login is optional. You can submit a report without an account.
    If you are logged in, your report can be connected to your
    student account.
  </p>


  <div id="message"></div>



  <form
    class="form"
    id="reportForm"
  >


    <!-- REPORT TYPE -->

    <div class="form-group">

      <label for="type">
        Report Type
      </label>

      <select
        id="type"
        required
      >

        <option value="">
          Select Type
        </option>

        <option value="Lost Item">
          Lost Item
        </option>

        <option value="Found Item">
          Found Item
        </option>

      </select>

    </div>



    <!-- ITEM NAME -->

    <div class="form-group">

      <label for="item">
        Item Name
      </label>

      <input
        id="item"
        type="text"
        required
        placeholder="Example: Wallet, ID, Phone"
      >

    </div>



    <!-- CATEGORY -->

    <div class="form-group">

      <label for="category">
        Category
      </label>

      <select
        id="category"
        required
      >

        <option value="">
          Select Category
        </option>

        <option value="Electronics">
          Electronics
        </option>

        <option value="School Supplies">
          School Supplies
        </option>

        <option value="Documents and IDs">
          Documents and IDs
        </option>

        <option value="Bags">
          Bags
        </option>

        <option value="Clothing">
          Clothing
        </option>

        <option value="Others">
          Others
        </option>

      </select>

    </div>



    <!-- LOCATION -->

    <div class="form-group">

      <label for="location">
        Location
      </label>

      <input
        id="location"
        type="text"
        required
        placeholder="Where was it lost/found?"
      >

    </div>



    <!-- DATE -->

    <div class="form-group">

      <label for="date">
        Date
      </label>

      <input
        id="date"
        type="date"
        required
      >

    </div>



    <!-- DESCRIPTION -->

    <div class="form-group">

      <label for="description">
        Description
      </label>

      <textarea
        id="description"
        required
        placeholder="Describe the item, including identifying details."
      ></textarea>

    </div>



    <!-- PHOTO -->

    <div class="form-group">

      <label for="photo">
        Photo (optional)
      </label>

      <input
        id="photo"
        type="file"
        accept="image/*"
      >

      <small>
        Maximum photo size: 1.5 MB
      </small>

    </div>



    <!-- SUBMIT -->

    <button
      id="submitButton"
      type="submit"
    >
      Submit Report
    </button>


  </form>


</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- YOUR APP -->

<script src="app.js"></script>



<script>

document.addEventListener("DOMContentLoaded", function () {


  /* ===============================
     NAVIGATION
  =============================== */

  renderStudentNav();



  /* ===============================
     DEFAULT DATE
  =============================== */

  const dateInput =
    document.getElementById("date");

  if (dateInput) {

    dateInput.value =
      new Date().toISOString().slice(0, 10);

  }



  /* ===============================
     FORM
  =============================== */

  const form =
    document.getElementById("reportForm");

  const message =
    document.getElementById("message");

  const submitButton =
    document.getElementById("submitButton");



  form.addEventListener("submit", async function (e) {

    e.preventDefault();



    /* ===============================
       GET VALUES
    =============================== */

    const type =
      document.getElementById("type").value;

    const item =
      document.getElementById("item").value.trim();

    const category =
      document.getElementById("category").value;

    const location =
      document.getElementById("location").value.trim();

    const date =
      document.getElementById("date").value;

    const description =
      document
        .getElementById("description")
        .value
        .trim();

    const file =
      document.getElementById("photo").files[0];



    /* ===============================
       PHOTO SIZE
    =============================== */

    if (file && file.size > 1500000) {

      message.innerHTML = `
        <div class="notice error">
          Photo is too large.
          Please choose an image under 1.5 MB.
        </div>
      `;

      return;

    }



    /* ===============================
       DISABLE BUTTON
    =============================== */

    submitButton.disabled = true;

    submitButton.textContent =
      "Submitting...";



    /* ===============================
       PHOTO HANDLING
    =============================== */

    let photoData = "";



    try {


      if (file) {

        photoData =
          await readFileAsDataURL(file);

      }



      /* ===============================
         SAVE TO SUPABASE
      =============================== */

      await saveReport({

        type: type,

        item: item,

        category: category,

        location: location,

        date: date,

        description: description,

        photo: photoData

      });



      /* ===============================
         SUCCESS
      =============================== */

      message.innerHTML = `
        <div class="notice success">
          Report submitted successfully!
        </div>
      `;



      form.reset();



      dateInput.value =
        new Date().toISOString().slice(0, 10);



      /*
        Give the user a moment to see
        the success message.
      */

      setTimeout(function () {

        window.location.href =
          "my-reports.html";

      }, 1000);



    } catch (error) {


      console.error(
        "REPORT SUBMISSION ERROR:",
        error
      );



      message.innerHTML = `
        <div class="notice error">
          Failed to submit the report.
          Please try again.
        </div>
      `;



      submitButton.disabled = false;

      submitButton.textContent =
        "Submit Report";

    }

  });


});



/* =========================================
   FILE READER
========================================= */

function readFileAsDataURL(file) {

  return new Promise(function (resolve, reject) {

    const reader =
      new FileReader();


    reader.onload = function () {

      resolve(reader.result);

    };


    reader.onerror = function () {

      reject(
        new Error("Unable to read image.")
      );

    };


    reader.readAsDataURL(file);

  });

}

</script>


</body>

</html>
