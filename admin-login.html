<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login</title><link rel="stylesheet" href="style.css"></head>
<body><main class="auth"><div class="auth-box"><h1>Admin Login</h1><div id="message"></div>
<form id="f"><div class="form-group"><label>Admin Email</label><input id="email" type="email" required></div><div class="form-group"><label>Password</label><input id="password" type="password" required></div><button style="width:100%">LOGIN</button></form>
<p class="small-link"><a href="index.html">← Student Home</a></p></div></main>
<script>
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();if(email.value.trim().toLowerCase()==="admin@bshs.edu"&&password.value==="admin123"){localStorage.setItem("bshs_admin","true");location.href="admin-dashboard.html"}else document.getElementById("message").innerHTML='<div class="notice error">Invalid admin credentials.</div>'});
</script></body></html>
